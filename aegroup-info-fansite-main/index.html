<!DOCTYPE html>
<html lang="ja">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NPHVYVNK6L"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-NPHVYVNK6L');
    </script>

    <meta charset="UTF-8">
    <title>Aぇ! group info</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css?v=20">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* 📱 カードデザイン（余白とピンクの影・枠線を元のゆったりした配置に復元） */
        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px; /* カード同士の余白を十分に確保 */
            box-shadow: 0 4px 12px rgba(255, 182, 193, 0.35);
            border: 2px solid #ffb6c1;
        }

        .card h2 {
            color: #ff69b4;
            font-size: 1.25rem;
            border-bottom: 2px solid #ffb6c1;
            padding-bottom: 10px;
            margin-bottom: 16px;
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 新着情報・本日のスケジュールの個別枠 */
        .update-item, .today-item { 
            position: relative; 
            padding: 14px 16px 14px 24px; 
            margin-bottom: 14px; 
            background: #ffffff; 
            border-radius: 12px; 
            font-size: 0.95rem;
            overflow: hidden; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            border: 1px solid #ffe4e1;
            line-height: 1.5;
        }
        
        .update-item::before, .today-item::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 8px; 
            background-color: #ff69b4; 
        }
        
        /* ピンクのボタン */
        .update-link-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 16px;
            background-color: #ff69b4;
            color: #fff !important;
            text-decoration: none !important;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(255, 105, 180, 0.3);
        }
        .update-link-btn:hover {
            background-color: #ff1493;
        }
        
        /* メンバーカラーライン */
        .bg-group::before { background-color: #ff69b4 !important; }     
        .bg-kojima::before { background-color: #800080 !important; }    
        .bg-masakado::before { background-color: #0000ff !important; }  
        .bg-suezawa::before { background-color: #ff0000 !important; }   
        .bg-sano::before { background-color: #008000 !important; }      
    </style>
</head>
<body>

    <header class="hero">
        <h1>Aぇ! group Info</h1>
        <p>インフォメーションサイト(非公式)</p>
        <button class="menu-trigger" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
    </header>

    <!-- 404エラーを防ぐため、実在するファイル名（または既存のアンカー）にタブリンクを修正 -->
    <nav class="tabs" id="navTabs">
        <a href="index.html">🏠 Home</a>
        <a href="index.html#updates">🆕 更新情報</a>
        <a href="schedule.html">📅 Schedule</a>
        <a href="sns.html">📱 SNS</a>
        <a href="members.html">👤 Members</a>
    </nav>

    <main style="max-width: 800px; margin: 24px auto; padding: 0 16px;">
        <!-- 1. 🆕 更新情報 -->
        <section class="card" id="updates">
            <h2>🆕 更新情報</h2>
            <div id="updateList">🔑 読み込み中...</div>
        </section>

        <!-- 2. 📅 本日のスケジュール -->
        <section class="card">
            <h2>📅 本日のスケジュール</h2>
            <div id="todayList">🔑 読み込み中...</div>
        </section>

        <!-- 3. 📢 サイト説明 -->
        <section class="card">
            <h2>📢 Welcome</h2>
            <p style="margin:0; font-size:0.92rem; color:#444; line-height:1.6;">スマートフォンでご覧の方は、右上の ≡ ボタンを押すと各メニュータブが表示されます。</p>
        </section>
    </main>

    <script>
        const CAL_API_URL = "https://script.google.com/macros/s/AKfycbyesrXQviLrOUQrWMjm_4RdI0DmZEgzzj27GOz1kg0Bs__U4nJ7vlE5q7652I0bE6rF/exec";

        function toggleMenu() {
            document.getElementById("navTabs").classList.toggle("show");
        }

        // ⏰ 本日のスケジュールの絵文字判定ロジック（復元）
        function getMediaEmoji(category, titleText = "") {
            const text = (String(category) + " " + String(titleText)).toLowerCase();
            
            if (text.includes("tv") || text.includes("テレビ") || text.includes("出演")) return "📺";
            if (text.includes("ラジオ") || text.includes("radio")) return "📻";
            if (text.includes("youtube") || text.includes("動画") || text.includes("配信")) return "🎥";
            if (text.includes("雑誌") || text.includes("本") || text.includes("表紙")) return "📕";
            if (text.includes("ライブ") || text.includes("コンサート") || text.includes("舞台") || text.includes("イベント")) return "🎤";
            if (text.includes("sns") || text.includes("インスタ") || text.includes("x") || text.includes("ブログ")) return "📱";
            if (text.includes("記念日") || text.includes("誕生日")) return "🎊";
            if (text.includes("販売") || text.includes("グッズ") || text.includes("cd")) return "🧾";
            
            return "⏰"; // デフォルトの時計絵文字
        }

        function getColorClass(text) {
            if (!text) return "bg-group";
            if (text.includes("小島")) return "bg-kojima";
            if (text.includes("正門")) return "bg-masakado";
            if (text.includes("末澤")) return "bg-suezawa";
            if (text.includes("佐野")) return "bg-sano";
            return "bg-group";
        }

        function extractUrl(text) {
            if (!text) return null;
            const match = String(text).match(/(https?:\/\/[^\s]+)/);
            return match ? match[0] : null;
        }

        function checkIsTodayUpdate(item) {
            const timestampVal = item["タイムスタンプ"] ?? item["Timestamp"] ?? item["timestamp"];
            if (timestampVal) {
                try {
                    const itemDate = new Date(timestampVal);
                    if (!isNaN(itemDate.getTime())) {
                        const now = new Date();
                        return itemDate.getFullYear() === now.getFullYear() &&
                               itemDate.getMonth() === now.getMonth() &&
                               itemDate.getDate() === now.getDate();
                    }
                } catch(e){}
            }

            const val = item["予定外の更新"] ?? item["予定外"] ?? item["更新"] ?? item["isExtra"];
            if (val === true || val === 1) return true;
            if (typeof val === 'string') {
                const s = val.trim().toLowerCase();
                return s === 'true' || s === '1' || s === 'yes';
            }
            return false;
        }

        function getTimeMillis(item) {
            const timeVal = item["タイムスタンプ"] || item["Timestamp"] || item["時間"] || item["time"];
            if (!timeVal) return 0;
            const d = new Date(timeVal);
            return isNaN(d.getTime()) ? 0 : d.getTime();
        }

        async function loadHomeData() {
            try {
                const response = await fetch(CAL_API_URL);
                const data = await response.json();
                
                // 1. 【更新情報】
                const updateList = document.getElementById("updateList");
                updateList.innerHTML = "";

                const updates = data.filter(item => checkIsTodayUpdate(item));
                updates.sort((a, b) => getTimeMillis(b) - getTimeMillis(a));

                if (updates.length === 0) {
                    updateList.innerHTML = "<p style='color:#777; padding: 5px 0;'>本日の新着更新情報はありません</p>";
                } else {
                    updates.forEach(item => {
                        const rawTitle = item["タイトル"] || item["title"] || item["内容"] || "";
                        const detailText = item["詳細"] || item["detail"] || item["メモ"] || "";
                        
                        let targetUrl = "";
                        for (let key in item) {
                            if (item.hasOwnProperty(key)) {
                                const urlCheck = extractUrl(item[key]);
                                if (urlCheck) {
                                    targetUrl = urlCheck;
                                    break; 
                                }
                            }
                        }

                        let displayTitle = rawTitle;
                        if (rawTitle.startsWith("http")) {
                            displayTitle = "SNS更新情報";
                        } else if (targetUrl && rawTitle.includes(targetUrl)) {
                            displayTitle = rawTitle.replace(targetUrl, '').trim() || "SNS更新情報";
                        }

                        let cleanDetail = detailText;
                        if (targetUrl && detailText.includes(targetUrl)) {
                            cleanDetail = detailText.replace(targetUrl, '').trim();
                        }

                        let timeStr = "";
                        const timeVal = item["タイムスタンプ"] || item["時間"] || item["Timestamp"];
                        if (timeVal) {
                            try {
                                const td = new Date(timeVal);
                                if (!isNaN(td.getTime())) {
                                    timeStr = ` (${String(td.getHours()).padStart(2, "0")}:${String(td.getMinutes()).padStart(2, "0")} 更新)`;
                                }
                            } catch(e){}
                        }

                        const memberText = item["担当"] || item["メンバー"] || item["出演者"] || "";
                        const colorClass = getColorClass(cleanDetail + displayTitle + memberText);
                        
                        const div = document.createElement("div");
                        div.className = `update-item ${colorClass}`;
                        
                        let htmlContent = `<span style="color:#e1306c; font-weight:bold;">🔥 新着情報${timeStr}</span><br>`;
                        if (displayTitle) {
                            htmlContent += `<strong style="font-size:1rem; color:#222;">${displayTitle}</strong>`;
                        }
                        
                        if (cleanDetail && cleanDetail !== displayTitle) {
                            htmlContent += `<br><span style="font-size:0.88rem; color:#555;">${cleanDetail}</span>`;
                        } else if (memberText && memberText !== displayTitle) {
                            htmlContent += `<br><span style="font-size:0.88rem; color:#555;">${memberText}</span>`;
                        }

                        if (targetUrl) {
                            htmlContent += `<br><a href="${targetUrl}" target="_blank" rel="noopener noreferrer" class="update-link-btn">📸 投稿を見る 🔗</a>`;
                        }

                        div.innerHTML = htmlContent;
                        updateList.appendChild(div);
                    });
                }

                // 2. 【本日のスケジュール】
                const todayList = document.getElementById("todayList");
                todayList.innerHTML = "";
                
                const now = new Date();
                const todayStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
                
                const todayEvents = data.filter(item => {
                    const dateVal = item["日付"] || item["date"];
                    if (!dateVal || item["タイムスタンプ"]) return false;

                    try {
                        const d = new Date(dateVal);
                        if (isNaN(d.getTime())) return false;
                        const itemDate = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
                        return itemDate === todayStr;
                    } catch(e) {
                        return false;
                    }
                });

                todayEvents.sort((a, b) => getTimeMillis(a) - getTimeMillis(b));

                if (todayEvents.length === 0) {
                    todayList.innerHTML = "<p style='color:#777; padding: 5px 0;'>今日の予定はありません</p>";
                } else {
                    todayEvents.forEach(item => {
                        const rawTitle = item["タイトル"] || item["title"] || "";
                        const detailText = item["詳細"] || item["detail"] || "";
                        const memberText = item["担当"] || item["メンバー"] || "";
                        const categoryText = item["ジャンル"] || item["媒体"] || item["区分"] || item["D列"] || "";
                        
                        // ⏰ 絵文字を取得
                        const emoji = getMediaEmoji(categoryText, rawTitle + detailText);
                        const colorClass = getColorClass(detailText + rawTitle + memberText);
                        
                        let timeStr = "";
                        const timeVal = item["時間"] || item["time"];
                        if (timeVal) {
                            try {
                                const td = new Date(timeVal);
                                if (!isNaN(td.getTime())) {
                                    timeStr = `${String(td.getHours()).padStart(2, "0")}:${String(td.getMinutes()).padStart(2, "0")} `;
                                }
                            } catch(e){}
                        }
                        
                        const div = document.createElement("div");
                        div.className = `today-item ${colorClass}`;
                        div.innerHTML = `<strong style="font-size:0.98rem; color:#222;">${emoji} ${timeStr}${rawTitle}</strong><br><span style='font-size:0.88rem; color:#666;'>${memberText || detailText}</span>`;
                        todayList.appendChild(div);
                    });
                }

            } catch (e) {
                document.getElementById("todayList").innerText = "データの読み込みに失敗しました。";
                document.getElementById("updateList").innerText = "データの読み込みに失敗しました。";
                console.error(e);
            }
        }

        document.addEventListener('DOMContentLoaded', loadHomeData);
    </script>
</body>
</html>
