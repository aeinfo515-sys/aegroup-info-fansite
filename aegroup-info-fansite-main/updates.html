<!DOCTYPE html>
<html lang="ja">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NPHVYVNK6L"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-NPHVYVNK6L');

    <meta charset="UTF-8">
    <title>過去更新情報 - Aぇ! group info</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 外部接続の高速化 -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <link rel="stylesheet" href="aegroup-info-fansite-main/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        .updates-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }

        .update-item {
            background: #fff;
            border-radius: 12px;
            padding: 14px 16px;
            border: 1px solid #ffe4e8;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            position: relative;
        }

        .update-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }

        /* 日付の改行を防ぐ修正 */
        .update-date {
            font-size: 0.85rem;
            color: #ff69b4;
            font-weight: bold;
            white-space: nowrap !important; /* 折り返し防止 */
        }

        .update-badge {
            font-size: 0.72rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
            color: #fff;
            background-color: #2c3e50;
            white-space: nowrap;
        }

        .update-content {
            font-size: 0.95rem;
            color: #333;
            line-height: 1.5;
            word-break: break-word;
        }

        .loading-box {
            text-align: center;
            padding: 15px;
            color: #888;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header class="hero">
        <h1>Aぇ! group Info</h1>
        <p>インフォメーションサイト(非公式)</p>
        <button class="menu-trigger" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
    </header>

    <nav class="tabs" id="navTabs">
        <a href="index.html">🏠 Home</a>
        <a href="updates.html" class="active">🆕 過去更新情報</a>
        <a href="schedule.html">📅 Schedule</a>
        <a href="requests.html">✉️ リクエスト・募集</a>
        <a href="works.html">🎬 出演作品</a>
        <a href="sns.html">📱 公式SNS</a>
        <a href="tickets.html">🎫 Tickets</a>
        <a href="members.html">👤 Members</a>
    </nav>

    <main style="max-width: 800px; margin: 15px auto; padding: 0 10px;">
        
        <section class="card">
            <h2 style="color: #ff69b4; border-bottom: 2px solid #ffd1dc; padding-bottom: 8px; margin-bottom: 10px; font-size: 1.2rem;">
                🆕 過去更新情報
            </h2>

            <div id="loading" class="loading-box">
                <i class="fa-solid fa-spinner fa-spin" style="color:#ff69b4; margin-right:4px;"></i> 最新データを確認中...
            </div>

            <!-- 更新情報一覧 -->
            <div id="updatesList" class="updates-container"></div>
        </section>

    </main>

    <script>
        // ※必要に応じて更新情報用のGAS API URLに変更してください
        const UPDATES_API_URL = "https://script.google.com/macros/s/AKfycbyesrXQviLrOUQrWMjm_4RdI0DmZEgzzj27GOz1kg0Bs__U4nJ7vlE5q7652I0bE6rF/exec";
        const CACHE_KEY = "aegroup_updates_data_cache";

        function toggleMenu() {
            document.getElementById("navTabs").classList.toggle("show");
        }

        function formatJapaneseDate(val) {
            if (!val) return "";
            const d = new Date(val);
            if (isNaN(d.getTime())) return String(val); // 日付型でない場合はそのまま表示

            const yyyy = d.getFullYear();
            const mm = d.getMonth() + 1;
            const dd = d.getDate();
            const weekDays = ["日", "月", "火", "水", "木", "金", "土"];
            const week = weekDays[d.getDay()];

            return `${yyyy}年${mm}月${dd}日(${week})`;
        }

        function renderUpdates(rawData) {
            const list = Array.isArray(rawData) ? rawData : (rawData.data || rawData.items || []);
            const container = document.getElementById("updatesList");
            container.innerHTML = "";

            if (list.length === 0) {
                container.innerHTML = "<p style='color:#777; text-align:center; padding:15px;'>更新情報はありません。</p>";
                return;
            }

            list.forEach(item => {
                const dateVal = Array.isArray(item) ? item[0] : (item["日付"] || item["date"] || Object.values(item)[0]);
                const badgeVal = Array.isArray(item) ? item[1] : (item["カテゴリ"] || item["category"] || "更新");
                const contentVal = Array.isArray(item) ? item[2] : (item["内容"] || item["title"] || item["content"] || "");

                const formattedDate = formatJapaneseDate(dateVal);

                const div = document.createElement("div");
                div.className = "update-item";
                div.innerHTML = `
                    <div class="update-header">
                        <span class="update-date">📅 ${escapeHtml(formattedDate)}</span>
                        ${badgeVal ? `<span class="update-badge">${escapeHtml(badgeVal)}</span>` : ''}
                    </div>
                    <div class="update-content">${escapeHtml(contentVal)}</div>
                `;
                container.appendChild(div);
            });
        }

        async function initUpdates() {
            let hasCache = false;

            // 1. キャッシュがあれば超即時に表示
            const cachedData = localStorage.getItem(CACHE_KEY);
            if (cachedData) {
                try {
                    const json = JSON.parse(cachedData);
                    renderUpdates(json);
                    hasCache = true;
                } catch (e) {
                    console.error("Cache Read Error:", e);
                }
            }

            // 2. バックグラウンドで最新データを取得
            try {
                const response = await fetch(UPDATES_API_URL);
                if (!response.ok) throw new Error("HTTP Error");

                const rawData = await response.json();

                // キャッシュ更新＆最新描画
                localStorage.setItem(CACHE_KEY, JSON.stringify(rawData));
                renderUpdates(rawData);

            } catch (e) {
                console.error("Fetch Error:", e);
                if (!hasCache) {
                    document.getElementById("updatesList").innerHTML = "<p style='color:#e53e3e; text-align:center; padding:15px;'>データの読み込みに失敗しました。</p>";
                }
            } finally {
                const loader = document.getElementById("loading");
                if (loader) loader.style.display = "none";
            }
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        document.addEventListener('DOMContentLoaded', initUpdates);
    </script>
</body>
</html>
