<!DOCTYPE html>
<html lang="ja">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NPHVYVNK6L"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      gtag('config', 'G-NPHVYVNK6L');

    <meta charset="UTF-8">
    <title>Schedule - Aぇ! group info</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="aegroup-info-fansite-main/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- FullCalendar CSS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet" />

    <style>
        /* 検索ボックスとチェックボックスのエリア */
        .search-container {
            border: 2px solid #ffd1dc;
            border-radius: 16px;
            padding: 12px 15px;
            background-color: #fff;
            margin-bottom: 15px;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            color: #888;
            font-size: 1rem;
        }

        .search-box input {
            width: 100%;
            padding: 9px 15px 9px 40px;
            border: 1.5px solid #ddd;
            border-radius: 25px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: #ff69b4;
        }

        /* メンバー絞り込みチェックボックス */
        .member-checkboxes {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: space-between;
            padding-top: 4px;
        }

        .member-label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #444;
            cursor: pointer;
            background: #f7f7f7;
            padding: 4px 8px;
            border-radius: 12px;
            border: 1px solid #eee;
        }

        .member-label input {
            accent-color: #ff69b4;
            cursor: pointer;
        }

        /* カレンダー全体のサイズ調整 */
        #calendar {
            background: #fff;
            padding: 6px;
            border-radius: 12px;
            border: 1px solid #ffe4e8;
        }

        .fc-toolbar-title {
            font-size: 1.15rem !important;
            color: #ff69b4 !important;
            font-weight: bold !important;
        }

        .fc-button {
            padding: 4px 8px !important;
            font-size: 0.8rem !important;
        }

        .fc-button-primary {
            background-color: #2c3e50 !important;
            border-color: #2c3e50 !important;
        }

        .fc-today-button {
            background-color: #708090 !important;
            border-color: #708090 !important;
            opacity: 1 !important;
        }

        .fc-daygrid-day {
            cursor: pointer;
        }

        .fc-daygrid-day-frame {
            min-height: 65px !important;
        }

        .fc-event {
            font-size: 0.72rem !important;
            padding: 1px 3px !important;
            margin-bottom: 1px !important;
            border-radius: 4px !important;
            pointer-events: none; /* 日付セルタップを優先 */
        }

        .fc-more-link {
            font-size: 0.7rem !important;
            color: #ff69b4 !important;
            font-weight: bold;
        }

        /* モーダルポップアップ (日付タップ時の一覧表示) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            max-width: 450px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
        }

        .modal-header {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ff69b4;
            border-bottom: 2px solid #ffd1dc;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .modal-close {
            position: absolute;
            top: 15px; right: 15px;
            font-size: 1.2rem;
            color: #999;
            cursor: pointer;
        }

        /* モーダル内カード表示 */
        .modal-schedule-item {
            position: relative;
            padding: 10px 12px 10px 18px;
            margin-bottom: 10px;
            background: #f9f9f9;
            border-radius: 10px;
            font-size: 0.9rem;
            border: 1px solid #eee;
            overflow: hidden;
        }

        .modal-schedule-item::before {
            content: "";
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 6px;
        }

        /* メンバーカラー（左側ボーダー） */
        .bg-group::before { background-color: #ff69b4 !important; }
        .bg-kojima::before { background-color: #800080 !important; }
        .bg-masakado::before { background-color: #0000ff !important; }
        .bg-suezawa::before { background-color: #ff0000 !important; }
        .bg-sano::before { background-color: #008000 !important; }

        .loading-box {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header class="hero">
        <h1>Aぇ! group Info</h1>
        <p>インフォメーションサイト(非公式)</p>
        <button class="menu-trigger" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
    </header>

    <nav class="tabs" id="navTabs">
        <a href="index.html">🏠 Home</a>
        <a href="updates.html">🆕 過去更新情報</a>
        <a href="schedule.html" class="active">📅 Schedule</a>
        <a href="requests.html">✉️ リクエスト・募集</a>
        <a href="works.html">🎬 出演作品</a>
        <a href="sns.html">📱 公式SNS</a>
        <a href="tickets.html">🎫 Tickets</a>
        <a href="members.html">👤 Members</a>
    </nav>

    <main style="max-width: 800px; margin: 15px auto; padding: 0 10px;">
        
        <section class="card">
            <h2 style="color: #ff69b4; border-bottom: 2px solid #ffd1dc; padding-bottom: 8px; margin-bottom: 10px; font-size: 1.2rem;">
                📅 Schedule
            </h2>

            <!-- 検索 & メンバー絞り込み (指定順: Aぇ! group・正門・末澤・小島・佐野) -->
            <div class="search-container">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="キーワードで検索..." oninput="filterCalendar()">
                </div>
                <div class="member-checkboxes">
                    <label class="member-label"><input type="checkbox" value="Aぇ! group" checked onchange="filterCalendar()"> Aぇ!</label>
                    <label class="member-label"><input type="checkbox" value="正門" checked onchange="filterCalendar()"> 正門</label>
                    <label class="member-label"><input type="checkbox" value="末澤" checked onchange="filterCalendar()"> 末澤</label>
                    <label class="member-label"><input type="checkbox" value="小島" checked onchange="filterCalendar()"> 小島</label>
                    <label class="member-label"><input type="checkbox" value="佐野" checked onchange="filterCalendar()"> 佐野</label>
                </div>
            </div>

            <div id="loading" class="loading-box">
                <i class="fa-solid fa-spinner fa-spin" style="color:#ff69b4; font-size:1.5rem; margin-bottom: 6px;"></i><br>読み込み中...
            </div>

            <!-- カレンダー表示エリア -->
            <div id="calendar"></div>

        </section>

    </main>

    <!-- 日付タップ時の予定一覧ポップアップ -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></span>
            <div class="modal-header" id="modalDate">📅 予定一覧</div>
            <div id="modalList"></div>
        </div>
    </div>

    <!-- FullCalendar JS -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/ja.js"></script>

    <script>
        const CAL_API_URL = "https://script.google.com/macros/s/AKfycbyesrXQviLrOUQrWMjm_4RdI0DmZEgzzj27GOz1kg0Bs__U4nJ7vlE5q7652I0bE6rF/exec";

        let allEvents = [];
        let calendar = null;

        function toggleMenu() {
            document.getElementById("navTabs").classList.toggle("show");
        }

        // メンバー名・判定カラーの一重定義
        function detectMemberInfo(item) {
            let fullStr = "";
            if (Array.isArray(item)) {
                fullStr = item.join(" ");
            } else if (typeof item === 'object' && item !== null) {
                fullStr = Object.values(item).join(" ");
            }

            if (fullStr.includes("佐野")) return { name: "佐野", colorClass: "bg-sano", hex: "#008000" };
            if (fullStr.includes("小島")) return { name: "小島", colorClass: "bg-kojima", hex: "#800080" };
            if (fullStr.includes("正門")) return { name: "正門", colorClass: "bg-masakado", hex: "#0000ff" };
            if (fullStr.includes("末澤")) return { name: "末澤", colorClass: "bg-suezawa", hex: "#ff0000" };
            return { name: "Aぇ! group", colorClass: "bg-group", hex: "#ff69b4" };
        }

        function toYMD(val) {
            if (!val) return "";
            const d = new Date(val);
            if (isNaN(d.getTime())) return "";
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, "0");
            const dd = String(d.getDate()).padStart(2, "0");
            return `${yyyy}-${mm}-${dd}`;
        }

        async function initSchedule() {
            try {
                const response = await fetch(CAL_API_URL);
                if (!response.ok) throw new Error("通信エラー");

                const rawData = await response.json();
                let list = Array.isArray(rawData) ? rawData : (rawData.data || rawData.items || []);

                document.getElementById("loading").style.display = "none";

                allEvents = list.map(item => {
                    const dateVal = Array.isArray(item) ? item[1] : (item["日付"] || item["date"] || item["B"] || Object.values(item)[1]);
                    const titleVal = (Array.isArray(item) ? item[2] : (item["タイトル"] || item["title"] || item["内容"])) || "予定";
                    const timeVal = Array.isArray(item) ? item[3] : (item["時間"] || item["time"]);
                    
                    const memberInfo = detectMemberInfo(item);
                    const ymd = toYMD(dateVal);

                    let timeStr = "";
                    if (timeVal) {
                        const td = new Date(timeVal);
                        if (!isNaN(td.getTime())) {
                            timeStr = `${String(td.getHours()).padStart(2, "0")}:${String(td.getMinutes()).padStart(2, "0")}`;
                        }
                    }

                    return {
                        title: titleVal,
                        start: ymd,
                        time: timeStr,
                        member: memberInfo.name,
                        colorClass: memberInfo.colorClass,
                        hexColor: memberInfo.hex
                    };
                }).filter(e => e.start !== "");

                renderCalendar(allEvents);

            } catch (e) {
                console.error(e);
                document.getElementById("loading").innerHTML = "<p style='color:#e53e3e;'>データの読み込みに失敗しました。</p>";
            }
        }

        function renderCalendar(events) {
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'ja',
                height: 'auto',
                dayMaxEvents: 4,
                headerToolbar: {
                    left: 'prev,next',
                    center: 'title',
                    right: 'today'
                },
                events: events.map(e => ({
                    title: e.title,
                    start: e.start,
                    backgroundColor: e.hexColor,
                    borderColor: e.hexColor
                })),
                dateClick: function(info) {
                    // 日付セルタップで該当日の予定をモーダル表示
                    showDayModal(info.dateStr);
                }
            });
            calendar.render();
        }

        function getFilteredEvents() {
            const keyword = document.getElementById("searchInput").value.toLowerCase().trim();
            const checkedMembers = Array.from(document.querySelectorAll('.member-checkboxes input:checked')).map(cb => cb.value);

            return allEvents.filter(e => {
                const matchKeyword = e.title.toLowerCase().includes(keyword) || e.start.includes(keyword);
                const matchMember = checkedMembers.includes(e.member);
                return matchKeyword && matchMember;
            });
        }

        function filterCalendar() {
            const filtered = getFilteredEvents();
            if (calendar) {
                calendar.removeAllEvents();
                calendar.addEventSource(filtered.map(e => ({
                    title: e.title,
                    start: e.start,
                    backgroundColor: e.hexColor,
                    borderColor: e.hexColor
                })));
            }
        }

        // 日付タップ時のモーダル表示機能
        function showDayModal(dateStr) {
            const filtered = getFilteredEvents();
            const dayEvents = filtered.filter(e => e.start === dateStr);

            document.getElementById("modalDate").innerText = `📅 ${dateStr} の予定`;
            const modalList = document.getElementById("modalList");
            modalList.innerHTML = "";

            if (dayEvents.length === 0) {
                modalList.innerHTML = "<p style='color:#777; text-align:center; padding:15px;'>この日の予定はありません。</p>";
            } else {
                dayEvents.forEach(e => {
                    const div = document.createElement("div");
                    div.className = `modal-schedule-item ${e.colorClass}`;
                    div.innerHTML = `
                        <div style="font-size:0.8rem; color:#e53e3e; font-weight:bold; margin-bottom:2px;">⏰ ${e.time ? e.time : '時間未定 / 終日'}</div>
                        <div style="font-size:0.95rem; font-weight:bold; color:#111; margin-bottom:3px;">${escapeHtml(e.title)}</div>
                        <div style="font-size:0.8rem; color:#666; font-weight:bold;">👤 ${escapeHtml(e.member)}</div>
                    `;
                    modalList.appendChild(div);
                });
            }

            document.getElementById("detailModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("detailModal").style.display = "none";
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        document.addEventListener('DOMContentLoaded', initSchedule);
    </script>
</body>
</html>
