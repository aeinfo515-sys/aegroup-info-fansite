<!DOCTYPE html>
<html lang="ja">
<head>

    <meta charset="UTF-8">

    <!-- 外部接続の高速化 -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- FullCalendar CSS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet" />

    <style>
        /* 検索ボックスとチェックボックスのエリア */
        .search-container {
            border: 2px solid #ffd1dc;
            border-radius: 18px;
            padding: 12px 10px;
            background-color: #fff;
            margin-bottom: 15px;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            color: #888;
            font-size: 1rem;
        }

        .search-box input {
            width: 100%;
            padding: 9px 15px 9px 40px;
            border: 1.5px solid #ddd;
            border-radius: 25px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: #ff69b4;
        }

        /* メンバー絞り込みチェックボックス */
        .member-checkboxes {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            width: 100%;
        }

        .checkbox-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            width: 100%;
        }

        .member-label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            background: #f3f3f3;
            padding: 6px 8px;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
            user-select: none;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .member-label input {
            accent-color: #ff69b4;
            cursor: pointer;
            width: 14px;
            height: 14px;
            margin: 0;
        }

        /* カレンダー全体のサイズ調整 */
        #calendar {
            background: #fff;
            padding: 6px;
            border-radius: 12px;
            border: 1px solid #ffe4e8;
            min-height: 400px;
        }

        .fc-toolbar-title {
            font-size: 1.15rem !important;
            color: #ff69b4 !important;
            font-weight: bold !important;
        }

        .fc-button {
            padding: 4px 8px !important;
            font-size: 0.8rem !important;
        }

        .fc-button-primary {
            background-color: #2c3e50 !important;
            border-color: #2c3e50 !important;
        }

        .fc-today-button {
            background-color: #708090 !important;
            border-color: #708090 !important;
            opacity: 1 !important;
            text-transform: lowercase;
        }

        .fc-daygrid-day {
            cursor: pointer;
        }

        .fc-daygrid-day-frame {
            min-height: 65px !important;
        }

        .fc-event {
            font-size: 0.72rem !important;
            padding: 1px 3px !important;
            margin-bottom: 1px !important;
            border-radius: 4px !important;
            pointer-events: none;
        }

        .fc-more-link {
            font-size: 0.7rem !important;
            color: #ff69b4 !important;
            font-weight: bold;
        }

        /* モーダルポップアップ */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 15px;
            box-sizing: border-box;
        }

        .modal-content {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            max-width: 420px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
            margin: auto;
            box-sizing: border-box;
        }

        .modal-header {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ff69b4;
            border-bottom: 2px solid #ffd1dc;
            padding-bottom: 8px;
            margin-bottom: 15px;
            padding-right: 25px;
        }

        .modal-close {
            position: absolute;
            top: 15px; right: 15px;
            font-size: 1.2rem;
            color: #999;
            cursor: pointer;
        }

        /* モーダル内カード表示 */
        .modal-schedule-item {
            position: relative;
            padding: 10px 12px 10px 18px;
            margin-bottom: 10px;
            background: #f9f9f9;
            border-radius: 10px;
            font-size: 0.9rem;
            border: 1px solid #eee;
            overflow: hidden;
        }

        .modal-schedule-item::before {
            content: "";
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 6px;
        }

        /* メンバーカラー（左側ボーダー） */
        .bg-group::before { background-color: #ff69b4 !important; }
        .bg-kojima::before { background-color: #800080 !important; }
        .bg-masakado::before { background-color: #0000ff !important; }
        .bg-suezawa::before { background-color: #ff0000 !important; }
        .bg-sano::before { background-color: #008000 !important; }

        .loading-box {
            text-align: center;
            padding: 10px;
            color: #888;
            font-size: 0.8rem;
        }
    </style>
    
    <!-- FullCalendar JS (deferで並行読み込み) -->
    <script defer src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/ja.js"></script>
</head>
<body>

    <header class="hero">
        <h1>Aぇ! group Info</h1>
        <p>インフォメーションサイト(非公式)</p>
        <button class="menu-trigger" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
    </header>

     <nav class="tabs" id="navTabs">
        <a href="index.html" class="active">🏠 ホーム</a>
        <a href="updates.html">🆕 過去更新情報</a>
        <a href="schedule.html">📅 スケジュール</a>
        <a href="requests.html">✉️ リクエスト・募集</a>
        <a href="works.html">🎬 出演作品</a>
        <a href="sns.html">📱 公式SNS</a>
        <a href="tickets.html">🎫 チケット</a>
        <a href="members.html">👤 メンバー</a>
    </nav>

    <main style="max-width: 800px; margin: 15px auto; padding: 0 10px;">
        
        <section class="card">
            <h2 style="color: #ff69b4; border-bottom: 2px solid #ffd1dc; padding-bottom: 8px; margin-bottom: 10px; font-size: 1.2rem;">
                📅 スケジュール
            </h2>

            <!-- 検索 & メンバー絞り込み -->
            <div class="search-container">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="キーワードで検索..." oninput="filterCalendar()">
                </div>
                <div class="member-checkboxes">
                    <div class="checkbox-row">
                        <label class="member-label"><input type="checkbox" value="Aぇ! group" checked onchange="filterCalendar()"> Aぇ! group</label>
                        <label class="member-label"><input type="checkbox" value="正門" checked onchange="filterCalendar()"> 正門</label>
                        <label class="member-label"><input type="checkbox" value="末澤" checked onchange="filterCalendar()"> 末澤</label>
                    </div>
                    <div class="checkbox-row">
                        <label class="member-label"><input type="checkbox" value="小島" checked onchange="filterCalendar()"> 小島</label>
                        <label class="member-label"><input type="checkbox" value="佐野" checked onchange="filterCalendar()"> 佐野</label>
                    </div>
                </div>
            </div>

            <div id="loading" class="loading-box">
                <i class="fa-solid fa-spinner fa-spin" style="color:#ff69b4; margin-right:4px;"></i> 最新データを確認中...
            </div>

            <!-- カレンダー表示エリア -->
            <div id="calendar"></div>

        </section>

    </main>

    <!-- 日付タップ時の予定一覧ポップアップ -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></span>
            <div class="modal-header" id="modalDate">📅 予定一覧</div>
            <div id="modalList"></div>
        </div>
    </div>

    <script>
        const CAL_API_URL = "https://script.google.com/macros/s/AKfycbyesrXQviLrOUQrWMjm_4RdI0DmZEgzzj27GOz1kg0Bs__U4nJ7vlE5q7652I0bE6rF/exec";
        const CACHE_KEY = "aegroup_schedule_data_cache";

        let allEvents = [];
        let calendar = null;
        let pendingData = null; // FullCalendar読み込み待ち用のデータ退避

        function toggleMenu() {
            document.getElementById("navTabs").classList.toggle("show");
        }

        function detectMemberInfo(item) {
            let fullStr = "";
            if (Array.isArray(item)) {
                fullStr = item.join(" ");
            } else if (typeof item === 'object' && item !== null) {
                fullStr = Object.values(item).join(" ");
            }

            if (fullStr.includes("佐野")) return { name: "佐野", colorClass: "bg-sano", hex: "#008000" };
            if (fullStr.includes("小島")) return { name: "小島", colorClass: "bg-kojima", hex: "#800080" };
            if (fullStr.includes("正門")) return { name: "正門", colorClass: "bg-masakado", hex: "#0000ff" };
            if (fullStr.includes("末澤")) return { name: "末澤", colorClass: "bg-suezawa", hex: "#ff0000" };
            return { name: "Aぇ! group", colorClass: "bg-group", hex: "#ff69b4" };
        }

        function toYMD(val) {
            if (!val) return "";
            const d = new Date(val);
            if (isNaN(d.getTime())) return "";
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, "0");
            const dd = String(d.getDate()).padStart(2, "0");
            return `${yyyy}-${mm}-${dd}`;
        }

        function formatJapaneseDate(dateStr) {
            const parts = dateStr.split('-');
            if (parts.length !== 3) return dateStr;
            
            const year = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10);
            const day = parseInt(parts[2], 10);
            
            const dateObj = new Date(year, month - 1, day);
            const weekDays = ["日", "月", "火", "水", "木", "金", "土"];
            const weekStr = weekDays[dateObj.getDay()];

            return `${month}/${day}(${weekStr})`;
        }

        function processScheduleData(rawData) {
            let list = Array.isArray(rawData) ? rawData : (rawData.data || rawData.items || []);

            allEvents = list.map(item => {
                const dateVal = Array.isArray(item) ? item[1] : (item["日付"] || item["date"] || item["B"] || Object.values(item)[1]);
                const titleVal = (Array.isArray(item) ? item[2] : (item["タイトル"] || item["title"] || item["内容"])) || "予定";
                const timeVal = Array.isArray(item) ? item[3] : (item["時間"] || item["time"]);
                
                const memberInfo = detectMemberInfo(item);
                const ymd = toYMD(dateVal);

                let timeStr = "";
                if (timeVal) {
                    const td = new Date(timeVal);
                    if (!isNaN(td.getTime())) {
                        timeStr = `${String(td.getHours()).padStart(2, "0")}:${String(td.getMinutes()).padStart(2, "0")}`;
                    }
                }

                return {
                    title: titleVal,
                    start: ymd,
                    time: timeStr,
                    member: memberInfo.name,
                    colorClass: memberInfo.colorClass,
                    hexColor: memberInfo.hex
                };
            }).filter(e => e.start !== "");

            // FullCalendarがまだ準備できていない場合は退避
            if (typeof FullCalendar === 'undefined') {
                pendingData = rawData;
                return;
            }

            if (!calendar) {
                renderCalendar(getFilteredEvents());
            } else {
                filterCalendar();
            }
        }

        function renderCalendar(events) {
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'ja',
                buttonText: { today: 'today' },
                height: 'auto',
                dayMaxEvents: 4,
                headerToolbar: {
                    left: 'prev,next',
                    center: 'title',
                    right: 'today'
                },
                events: events.map(e => ({
                    title: e.title,
                    start: e.start,
                    backgroundColor: e.hexColor,
                    borderColor: e.hexColor
                })),
                dateClick: function(info) {
                    showDayModal(info.dateStr);
                }
            });
            calendar.render();
        }

        async function initSchedule() {
            let hasCache = false;

            // 1. キャッシュがあれば超即時にデータ変換を実行
            const cachedData = localStorage.getItem(CACHE_KEY);
            if (cachedData) {
                try {
                    const json = JSON.parse(cachedData);
                    processScheduleData(json);
                    hasCache = true;
                } catch (e) {
                    console.error("Cache Read Error:", e);
                }
            }

            // 2. バックグラウンドでGASからデータ取得（非同期）
            try {
                const response = await fetch(CAL_API_URL);
                if (!response.ok) throw new Error("HTTP Error");

                const rawData = await response.json();

                // キャッシュ更新＆画面反映
                localStorage.setItem(CACHE_KEY, JSON.stringify(rawData));
                processScheduleData(rawData);

            } catch (e) {
                console.error("Fetch Error:", e);
                if (!hasCache) {
                    document.getElementById("loading").innerHTML = "<span style='color:#e53e3e;'>データの読み込みに失敗しました。再読み込みをお試しください。</span>";
                    return;
                }
            } finally {
                // 完了したらローディングを非表示
                const loader = document.getElementById("loading");
                if (loader) loader.style.display = "none";
            }
        }

        function getFilteredEvents() {
            const keyword = document.getElementById("searchInput").value.toLowerCase().trim();
            const checkedMembers = Array.from(document.querySelectorAll('.member-checkboxes input:checked')).map(cb => cb.value);

            return allEvents.filter(e => {
                const matchKeyword = e.title.toLowerCase().includes(keyword) || e.start.includes(keyword);
                const matchMember = checkedMembers.includes(e.member);
                return matchKeyword && matchMember;
            });
        }

        function filterCalendar() {
            const filtered = getFilteredEvents();
            if (calendar) {
                calendar.removeAllEvents();
                calendar.addEventSource(filtered.map(e => ({
                    title: e.title,
                    start: e.start,
                    backgroundColor: e.hexColor,
                    borderColor: e.hexColor
                })));
            }
        }

        function showDayModal(dateStr) {
            const filtered = getFilteredEvents();
            const dayEvents = filtered.filter(e => e.start === dateStr);

            dayEvents.sort((a, b) => {
                if (!a.time && !b.time) return 0;
                if (!a.time) return 1;
                if (!b.time) return -1;
                return a.time.localeCompare(b.time);
            });

            const formattedDate = formatJapaneseDate(dateStr);
            document.getElementById("modalDate").innerText = `🗓️ ${formattedDate} の予定`;
            
            const modalList = document.getElementById("modalList");
            modalList.innerHTML = "";

            if (dayEvents.length === 0) {
                modalList.innerHTML = "<p style='color:#777; text-align:center; padding:15px;'>この日の予定はありません。</p>";
            } else {
                dayEvents.forEach(e => {
                    const div = document.createElement("div");
                    div.className = `modal-schedule-item ${e.colorClass}`;
                    div.innerHTML = `
                        <div style="font-size:0.8rem; color:#e53e3e; font-weight:bold; margin-bottom:2px;">⏰ ${e.time ? e.time : '時間未定 / 終日'}</div>
                        <div style="font-size:0.95rem; font-weight:bold; color:#111; margin-bottom:3px;">${escapeHtml(e.title)}</div>
                        <div style="font-size:0.8rem; color:#666; font-weight:bold;">👤 ${escapeHtml(e.member)}</div>
                    `;
                    modalList.appendChild(div);
                });
            }

            document.getElementById("detailModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("detailModal").style.display = "none";
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // JSライブラリの準備が整ったら初期化を開始する
        window.addEventListener('load', () => {
            initSchedule();
            if (pendingData) {
                processScheduleData(pendingData);
            }
        });
    </script>
</body>
</html>
