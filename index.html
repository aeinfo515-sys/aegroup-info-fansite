<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Aぇ! group Info</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css?v=100">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <header class="hero">
        <h1>Aぇ! group Info</h1>
        <p>インフォメーションサイト(非公式)</p>
        <button class="menu-trigger" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
    </header>

    <nav class="tabs" id="navTabs">
        <a href="index.html" class="active">🏠 Home</a>
        <a href="updates.html">🆕 過去更新情報</a>
        <a href="schedule.html">📅 Schedule</a>
        <a href="requests.html">✉️ リクエスト・募集</a>
        <a href="works.html">🎬 出演作品</a>
        <a href="sns.html">📱 公式SNS</a>
        <a href="tickets.html">🎫 Tickets</a>
        <a href="members.html">👤 Members</a>
    </nav>

    <main style="max-width: 800px; margin: 24px auto; padding: 0 16px;">
        <section class="card">
            <h2>🆕 更新情報</h2>
            <div id="updateList">🔑 読み込み中...</div>
        </section>

        <section class="card">
            <h2>📅 本日のスケジュール</h2>
            <div id="todayList">🔑 読み込み中...</div>
        </section>

        <section class="card">
            <h2>📢 Welcome</h2>
            <p style="margin:0; font-size:0.92rem; color:#444; line-height:1.6;">スマートフォンでご覧の方は、右上の ≡ ボタンを押すと各メニュータブが表示されます。</p>
        </section>
    </main>

    <script>
        const CAL_API_URL = "https://script.google.com/macros/s/AKfycbyesrXQviLrOUQrWMjm_4RdI0DmZEgzzj27GOz1kg0Bs__U4nJ7vlE5q7652I0bE6rF/exec";

        function toggleMenu() { document.getElementById("navTabs").classList.toggle("show"); }

        function getMediaEmoji(category, text = "") {
            const combined = (String(category) + " " + String(text)).toLowerCase();
            if (combined.includes("tv") || combined.includes("テレビ")) return "📺";
            if (combined.includes("ラジオ")) return "📻";
            if (combined.includes("youtube") || combined.includes("動画")) return "🎥";
            if (combined.includes("雑誌")) return "📕";
            if (combined.includes("ライブ") || combined.includes("イベント")) return "🎤";
            if (combined.includes("sns") || combined.includes("インスタ") || combined.includes("x")) return "📱";
            return "⏰";
        }

        function getColorClass(text) {
            if (!text) return "bg-group";
            if (text.includes("小島")) return "bg-kojima";
            if (text.includes("正門")) return "bg-masakado";
            if (text.includes("末澤")) return "bg-suezawa";
            if (text.includes("佐野")) return "bg-sano";
            return "bg-group";
        }

        function extractUrl(text) {
            if (!text) return null;
            const match = String(text).match(/(https?:\/\/[^\s]+)/);
            return match ? match[0] : null;
        }

        async function loadHomeData() {
            try {
                const response = await fetch(CAL_API_URL);
                const data = await response.json();
                const now = new Date();
                const todayStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');

                // 本日の更新情報
                const updateList = document.getElementById("updateList");
                updateList.innerHTML = "";
                const updates = data.filter(item => {
                    const ts = item["タイムスタンプ"] || item["Timestamp"];
                    if (!ts) return false;
                    const d = new Date(ts);
                    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
                });

                if (updates.length === 0) updateList.innerHTML = "<p style='color:#777;'>本日の新着更新情報はありません</p>";
                else {
                    updates.forEach(item => {
                        const title = item["タイトル"] || item["内容"] || "";
                        const detail = item["詳細"] || item["メモ"] || "";
                        const colorClass = getColorClass(title + detail);
                        const url = extractUrl(title + detail);
                        const div = document.createElement("div");
                        div.className = `update-item ${colorClass}`;
                        div.innerHTML = `<span style="color:#e1306c; font-weight:bold;">🔥 新着情報</span><br><strong>${title}</strong><br><span style="font-size:0.85rem; color:#666;">${detail}</span>${url ? `<br><a href="${url}" target="_blank" class="update-link-btn">📸 投稿を見る 🔗</a>` : ''}`;
                        updateList.appendChild(div);
                    });
                }

                // 本日のスケジュール
                const todayList = document.getElementById("todayList");
                todayList.innerHTML = "";
                const todayEvents = data.filter(item => {
                    const dateVal = item["日付"] || item["date"];
                    if (!dateVal || item["タイムスタンプ"]) return false;
                    const d = new Date(dateVal);
                    const itemDate = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
                    return itemDate === todayStr;
                });

                if (todayEvents.length === 0) todayList.innerHTML = "<p style='color:#777;'>今日の予定はありません</p>";
                else {
                    todayEvents.forEach(item => {
                        const title = item["タイトル"] || "";
                        const detail = item["詳細"] || item["メンバー"] || "";
                        const emoji = getMediaEmoji(item["ジャンル"] || "", title + detail);
                        const colorClass = getColorClass(title + detail);
                        const div = document.createElement("div");
                        div.className = `today-item ${colorClass}`;
                        div.innerHTML = `<strong>${emoji} ${title}</strong><br><span style="font-size:0.85rem; color:#666;">${detail}</span>`;
                        todayList.appendChild(div);
                    });
                }
            } catch(e) { console.error(e); }
        }
        document.addEventListener('DOMContentLoaded', loadHomeData);
    </script>
</body>
</html>
