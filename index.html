<!DOCTYPE html>
<html lang="ja">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NPHVYVNK6L"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

    <meta charset="UTF-8">
    <title>Home - Aぇ! group info</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="aegroup-info-fansite-main/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* メンバーカラー（左側ボーダー） */
        .bg-group { border-left: 4px solid #ff69b4 !important; }
        .bg-kojima { border-left: 4px solid #800080 !important; }
        .bg-masakado { border-left: 4px solid #0000ff !important; }
        .bg-suezawa { border-left: 4px solid #ff0000 !important; }
        .bg-sano { border-left: 4px solid #008000 !important; }
    </style>
</head>
<body>

    <header class="hero">
        <h1>Aぇ! group Info</h1>
        <p>インフォメーションサイト(非公式)</p>
        <button class="menu-trigger" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
    </header>

    <nav class="tabs" id="navTabs">
        <a href="index.html" class="active">🏠 Home</a>
        <a href="updates.html">🆕 過去更新情報</a>
        <a href="schedule.html">📅 Schedule</a>
        <a href="requests.html">✉️ リクエスト・募集</a>
        <a href="works.html">🎬 出演作品</a>
        <a href="sns.html">📱 公式SNS</a>
        <a href="tickets.html">🎫 Tickets</a>
        <a href="members.html">👤 Members</a>
    </nav>

    <main style="max-width: 800px; margin: 15px auto; padding: 0 10px;">
        
        <!-- ① 最新更新情報（上配置） -->
        <section class="card">
            <h2 style="color: #ff69b4; border-bottom: 2px solid #ffd1dc; padding-bottom: 8px; margin-bottom: 12px; font-size: 1.2rem;">
                🆕 最新更新情報
            </h2>
            <div id="latest-updates">
                <div class="loading-text" style="text-align: center; color: #888; padding: 15px;">
                    <i class="fa-solid fa-spinner fa-spin" style="color: #ff69b4;"></i> 読み込み中...
                </div>
            </div>
        </section>

        <!-- ② 本日のスケジュール（下配置） -->
        <section class="card" style="margin-top: 20px;">
            <h2 style="color: #ff69b4; border-bottom: 2px solid #ffd1dc; padding-bottom: 8px; margin-bottom: 12px; font-size: 1.2rem;">
                📅 本日のスケジュール
            </h2>
            <div id="today-schedule">
                <div class="loading-text" style="text-align: center; color: #888; padding: 15px;">
                    <i class="fa-solid fa-spinner fa-spin" style="color: #ff69b4;"></i> 読み込み中...
                </div>
            </div>
        </section>

    </main>

    <script>
        const CAL_API_URL = "https://script.google.com/macros/s/AKfycbyesrXQviLrOUQrWMjm_4RdI0DmZEgzzj27GOz1kg0Bs__U4nJ7vlE5q7652I0bE6rF/exec";
        const UPDATE_API_URL = "https://script.google.com/macros/s/AKfycbwqVSoDqfV4QfKoxY_sA2z0dI90z28N9gYJ5y3Z/exec";

        const CACHE_KEY_SCHEDULE = "aegroup_home_schedule_cache";
        const CACHE_KEY_UPDATES = "aegroup_home_updates_cache";

        function toggleMenu() {
            document.getElementById("navTabs").classList.toggle("show");
        }

        // --- 配列化補正 ---
        function extractList(rawData) {
            if (!rawData) return [];
            if (Array.isArray(rawData)) return rawData;
            if (Array.isArray(rawData.data)) return rawData.data;
            if (Array.isArray(rawData.items)) return rawData.items;
            return [];
        }

        // --- メンバー判定 ---
        function detectMemberClass(item) {
            let fullStr = "";
            if (Array.isArray(item)) {
                fullStr = item.join(" ");
            } else if (typeof item === 'object' && item !== null) {
                fullStr = Object.values(item).join(" ");
            }

            if (fullStr.includes("佐野")) return "bg-sano";
            if (fullStr.includes("小島")) return "bg-kojima";
            if (fullStr.includes("正門")) return "bg-masakado";
            if (fullStr.includes("末澤")) return "bg-suezawa";
            return "bg-group";
        }

        // --- 時間文字列の正常化（HH:mm形式へ変換） ---
        function formatTimeString(timeVal) {
            if (!timeVal) return "";
            const str = String(timeVal).trim();
            if (!str || str.toLowerCase() === "undefined" || str.toLowerCase() === "null") return "";

            // 日時文字列（ISO型含む）の場合
            const d = new Date(str);
            if (!isNaN(d.getTime())) {
                const hh = String(d.getHours()).padStart(2, "0");
                const mm = String(d.getMinutes()).padStart(2, "0");
                return `${hh}:${mm}`;
            }

            // 「18:00:00」のような文字列の場合
            const match = str.match(/(\d{1,2}):(\d{2})/);
            if (match) {
                const hh = String(match[1]).padStart(2, "0");
                const mm = match[2];
                return `${hh}:${mm}`;
            }

            return str;
        }

        // --- YYYY-MM-DD 変換 ---
        function toYMD(val) {
            if (!val) return "";
            const d = new Date(val);
            if (isNaN(d.getTime())) return "";
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, "0");
            const dd = String(d.getDate()).padStart(2, "0");
            return `${yyyy}-${mm}-${dd}`;
        }

        // --- 1. 最新更新情報読み込み ---
        async function loadLatestUpdates() {
            const container = document.getElementById("latest-updates");

            const cached = localStorage.getItem(CACHE_KEY_UPDATES);
            if (cached) {
                try { renderLatestUpdates(JSON.parse(cached)); } catch(e){}
            }

            try {
                const res = await fetch(UPDATE_API_URL);
                if (!res.ok) throw new Error();
                const rawData = await res.json();

                localStorage.setItem(CACHE_KEY_UPDATES, JSON.stringify(rawData));
                renderLatestUpdates(rawData);
            } catch (e) {
                if (!cached) {
                    container.innerHTML = "<p style='color:#888; text-align:center;'>更新情報の取得に失敗しました。</p>";
                }
            }
        }

        function renderLatestUpdates(rawData) {
            const container = document.getElementById("latest-updates");
            const list = extractList(rawData);

            if (list.length === 0) {
                container.innerHTML = "<p style='color:#777; text-align:center; padding:10px;'>更新情報はありません。</p>";
                return;
            }

            const top5 = list.slice(0, 5);
            let html = "";
            top5.forEach(item => {
                let date = "";
                let content = "";

                if (Array.isArray(item)) {
                    date = item[0] || item[1] || "";
                    content = item[1] || item[2] || "";
                } else if (typeof item === 'object' && item !== null) {
                    date = item["日付"] || item["date"] || Object.values(item)[0] || "";
                    content = item["内容"] || item["text"] || Object.values(item)[1] || "";
                } else {
                    content = String(item);
                }

                // 日付が日時オブジェクトっぽい場合は整形
                if (date && date.length > 10) {
                    const ym = toYMD(date);
                    if (ym) date = ym.replace(/-/g, "/");
                }

                html += `
                    <div style="border-bottom:1px dashed #eee; padding:8px 0; font-size:0.9rem;">
                        <span style="color:#ff69b4; font-weight:bold; margin-right:8px;">${escapeHtml(date)}</span>
                        <span style="color:#333;">${escapeHtml(content)}</span>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // --- 2. 本日のスケジュール読み込み ---
        async function loadTodaySchedule() {
            const container = document.getElementById("today-schedule");

            const cached = localStorage.getItem(CACHE_KEY_SCHEDULE);
            if (cached) {
                try { renderTodaySchedule(JSON.parse(cached)); } catch(e){}
            }

            try {
                const res = await fetch(CAL_API_URL);
                if (!res.ok) throw new Error();
                const rawData = await res.json();
                
                localStorage.setItem(CACHE_KEY_SCHEDULE, JSON.stringify(rawData));
                renderTodaySchedule(rawData);
            } catch (e) {
                if (!cached) {
                    container.innerHTML = "<p style='color:#888; text-align:center;'>スケジュールの取得に失敗しました。</p>";
                }
            }
        }

        function renderTodaySchedule(rawData) {
            const container = document.getElementById("today-schedule");
            const list = extractList(rawData);

            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            const todayStr = `${yyyy}-${mm}-${dd}`;
            
            const todayEvents = list.filter(item => {
                const dateVal = Array.isArray(item) ? item[1] : (item["日付"] || item["date"] || item["B"]);
                return toYMD(dateVal) === todayStr;
            });

            if (todayEvents.length === 0) {
                container.innerHTML = "<p style='color:#777; text-align:center; padding:10px;'>本日予定されているスケジュールはありません。</p>";
                return;
            }

            let html = "";
            todayEvents.forEach(item => {
                const title = (Array.isArray(item) ? item[2] : (item["タイトル"] || item["title"] || item["内容"])) || "予定";
                const timeRaw = Array.isArray(item) ? item[3] : (item["時間"] || item["time"]);
                const timeFormatted = formatTimeString(timeRaw);
                
                const memberClass = detectMemberClass(item);

                html += `
                    <div class="${memberClass}" style="background:#f9f9f9; padding:10px 12px; margin-bottom:8px; border-radius:6px;">
                        <div style="font-size:0.8rem; color:#e53e3e; font-weight:bold;">⏰ ${timeFormatted ? escapeHtml(timeFormatted) : '時間未定 / 終日'}</div>
                        <div style="font-size:0.95rem; font-weight:bold; color:#333;">${escapeHtml(title)}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function escapeHtml(str) {
            if (!str) return "";
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadLatestUpdates();
            loadTodaySchedule();
        });
    </script>
</body>
</html>
